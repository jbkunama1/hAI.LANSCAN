services:
  lanscan:
    image: ghcr.io/jbkunama1/hai.lanscan:${LANSCAN_VERSION:-latest}
    container_name: hai-lanscan
    restart: unless-stopped
    ports:
      - "${LANSCAN_PORT:-8088}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      MCP_TOKEN: ${MCP_TOKEN:?Set random MCP_TOKEN with at least 24 characters}
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-192.168.178.0/24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
    volumes:
      - lanscan-data:/data
    networks: [highfishnetwork]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
  mcp:
    image: ghcr.io/jbkunama1/hai.lanscan:${LANSCAN_VERSION:-latest}
    container_name: hai-lanscan-mcp
    command: ["python", "integrations.py", "mcp"]
    restart: unless-stopped
    depends_on: [lanscan]
    ports:
      - "8089:8089"
    environment:
      LANSCAN_URL: http://hai-lanscan:8080
      MCP_TOKEN: ${MCP_TOKEN:?Set MCP_TOKEN}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-192.168.178.1:*,127.0.0.1:*,localhost:*,hai-lanscan-mcp:*}
    networks: [highfishnetwork]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
  telegram:
    image: ghcr.io/jbkunama1/hai.lanscan:${LANSCAN_VERSION:-latest}
    container_name: hai-lanscan-telegram
    command: ["python", "integrations.py", "bot"]
    restart: unless-stopped
    depends_on: [lanscan]
    environment:
      LANSCAN_URL: http://hai-lanscan:8080
      MCP_TOKEN: ${MCP_TOKEN:?Set MCP_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
    networks: [highfishnetwork]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
volumes:
  lanscan-data:
    name: hai-lanscan-data
networks:
  highfishnetwork:
    external: true
    name: highfishnetwork
