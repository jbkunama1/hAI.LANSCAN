name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q core.py tests
          node --check static/v1.js
          node --check tests/browser.cjs
      - name: Backend tests
        run: python -m unittest discover -s tests -p 'test_core.py' -v
      - name: Validate compose
        env:
          ADMIN_PASSWORD: ci-password-12345
          SECRET_KEY: ci-secret-not-production-1234567890123456789
        run: |
          docker compose config -q
          docker compose -f compose.portainer.yaml config -q
      - name: Build test image
        run: docker build --pull -t hai-lanscan:ci .
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Container and mobile/desktop browser smoke tests
        run: |
          docker run -d --name smoke -p 127.0.0.1:18088:8080 -e ADMIN_PASSWORD=ci-password-12345 -e SECRET_KEY=ci-secret-not-production-1234567890123456789 hai-lanscan:ci
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/healthz > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node tests/browser.cjs
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jbkunama1/hai.lanscan
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
