name: Test and Docker build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate compose
        env:
          ADMIN_PASSWORD: ci-test-password-not-production
          SECRET_KEY: ci-test-secret-not-production-123456789
        run: docker compose config -q
      - name: Build Docker image
        run: docker build --pull -t hai-lanscan:ci .
      - name: Container smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:18088:8080 -e ADMIN_PASSWORD=ci-test-password -e SECRET_KEY=ci-test-secret-not-production-123456789 hai-lanscan:ci
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
